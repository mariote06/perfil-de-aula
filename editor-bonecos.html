<script>
  const AV_VEIC = { e:['🚴', 'Bicicleta de estrada'], b:['🚵', 'BTT'], t:['⏱️', 'Contrarrelógio'], r:['🛞', 'Triciclo'], k:['🏎️', 'Kart a pedais'], c:['🚗', 'Carrinho a pedais'], n:['🛷', 'Trenó com rena'] };
  const AV_CAM = ['#E5242B', '#FF7A00', '#FFD60A', '#3DD45C', '#00B3A4', '#1F7AE0', '#5B3FD9', '#E040A0', '#1F2937', '#F3F4F6'];
  const AV_CAP = ['#F3F4F6', '#1F2937', '#E5242B', '#FFD60A', '#1F7AE0', '#3DD45C', '#FF7A00', '#E040A0'];
  const AV_PELE = ['#F2C9A6', '#E0AE86', '#C68A5E', '#9A6440', '#6B4228'];
  function avLe(t){ if(!t || typeof t !== 'string') return null; const q = t.split('.'); if(!AV_VEIC[q[0]]) return null;
    const h = (v, d)=> /^[0-9A-Fa-f]{6}$/.test(v || '') ? '#' + v.toUpperCase() : d, kc = q[0] === 'k' || q[0] === 'c' || q[0] === 'n', j = h(q[1], '#1F7AE0');

  function avTxt(a){ return [a.v, a.j.slice(1), a.h.slice(1), a.p.slice(1), a.H || 'cic', a.T || 'cam', (a.vc || '#22262D').slice(1), a.pub ? 1 : 0, a.g === 'f' ? 'f' : 'm'].join('.'); }
  // ===== o que o aluno leva na cabeça e no corpo, vistos de costas =====
  const AV_CAB = { cic:['⛑️', 'Capacete de ciclista'], pil:['🪖', 'Capacete de piloto'], vik:['🛡️', 'Capacete viking'], pn:['🎅', 'Gorro de Pai Natal'], elf:['🧝', 'Gorro de elfo'],
    cha:['🎩', 'Chapéu'], cow:['🤠', 'Chapéu de cowboy'], cog:['🍄', 'Chapéu de cogumelo'], pap:['⛪', 'Mitra do Papa'], ush:['🧣', 'Ushanka'], coc:['🪶', 'Cocar de penas'],
    moh:['🤘', 'Mohawk'], lon:['💁', 'Cabelo comprido'], rab:['🎀', 'Rabo de cavalo'], cur:['💈', 'Cabelo curto'] };
  const AV_COR = { cam:['🚴', 'Camisola de ciclista'], nu:['💪', 'Tronco nu'], sus:['🩳', 'Suspensórios'], mot:['🏍️', 'Casaco de motociclista'], pun:['📌', 'Casaco punk com picos'],
    ral:['🏁', 'Fato de rali'], f1:['🏎️', 'Fato de Fórmula 1'], pnc:['🎅', 'Casaco de Pai Natal'], elc:['🧝', 'Casaco de elfo'], col:['🦺', 'Colete fluorescente'],
    cow:['🤠', 'Camisa aos quadrados e ganga'], cog:['🍄', 'Jardineiras de cogumelo'], pap:['⛪', 'Batina e estola'], ush:['🧥', 'Capote militar soviético'], coc:['🪶', 'Túnica com franjas'] };
  const AV_CABELO = ['#1A1A1A', '#3B2A20', '#6B4A2E', '#C9A04A', '#E8D08A', '#B5462A', '#9AA0A6', '#E040A0', '#1F7AE0', '#3DD45C'];
  const AV_VCOR = ['#E5242B', '#FF7A00', '#FFD60A', '#3DD45C', '#1F7AE0', '#5B3FD9', '#E040A0', '#22262D', '#F3F4F6', '#9AA3AE'];
  const avCabelo = t=> t === 'moh' || t === 'lon' || t === 'rab' || t === 'cur';
  const AV_CHAP = ['#6B4A2E', '#3B2A20', '#C9A04A', '#E8D9B0', '#1A1A1A', '#F3F4F6', '#E5242B', '#1F7AE0'];
  // cada chapéu tem a sua roupa (escolhida logo, mas pode mudar-se)
  const AV_PAR = { pn: 'pnc', elf: 'elc', cow: 'cow', cog: 'cog', pap: 'pap', ush: 'ush', coc: 'coc' };

  function avGrupo(H){ return avCabelo(H) || H === 'vik' || H === 'pn' || H === 'elf' || H === 'ush' ? 'cab' : H === 'cha' || H === 'cow' ? 'chap' : H === 'pap' || H === 'coc' ? 'fixo' : 'cap'; }
  const AV_MLONGA = ['mot', 'pun', 'ral', 'f1', 'pnc', 'elc', 'cow', 'pap', 'ush', 'coc'];
  // calças de cada roupa (null = calção de ciclista) e calçado
  function avCalca(T, rc){ return T === 'ral' || T === 'f1' ? rc : ({ pnc: '#C8102E', elc: '#1E9E46', mot: '#26324F', pun: '#26324F', cow: '#2F4A7A', cog: '#8A5A2E', pap: '#F7F5EE', ush: '#3E4634', coc: '#B88A58' })[T] || null; }
  function avSapato(T){ return ({ pnc: '#1A1A1A', mot: '#1A1A1A', pun: '#1A1A1A', ush: '#1A1A1A', elc: '#C8102E', cow: '#6B4423', cog: '#6B4423', coc: '#8A5A2E', pap: '#B0141E' })[T] || '#F3F4F6'; }
  // cor da roupa: Pai Natal sempre vermelho, elfo sempre verde, tronco nu da cor da pele
  function avRoupa(av){ const T = av.T; return T === 'nu' || T === 'sus' ? av.p : ({ pnc: '#C8102E', elc: '#1E9E46', col: '#D4FF1E', pap: '#F7F5EE', ush: '#5B6648', coc: '#C79A66', cog: '#F2E6CF' })[T] || av.j; }
  // =====================================================================
  // CICLISTA 3D REALISTA
  // Bicicleta (estrada, BTT, contrarrelógio ou triciclo) e um corpo com proporções humanas cujas pernas seguem
  // os pedais (cinemática inversa: anca → joelho → tornozelo) e as mãos ficam no guiador.
  // Veste o que o aluno escolheu no telemóvel: camisola, calças, sapatos, chapéu/capacete/cabelo e publicidade.
  // Medidas em metros (x para a frente, y para cima, z para o lado).
  // =====================================================================
  // =====================================================================
  // HUMANO REALISTA (modelo profissional feito com o MakeHuman/MPFB2, licença CC0):
  // corpo com músculos e esqueleto de 53 ossos (ciclista_m.glb / ciclista_f.glb, ao lado desta página).
  // O equipamento é pintado ponto a ponto (bainhas, mangas e gola lisas) com as cores de cada aluno,
  // e os ossos dobram-se em tempo real: pernas aos pedais, mãos ao guiador, tronco inclinado e cabeça a olhar em frente.
  // =====================================================================
  // afinações dos bonecos (postura, pescoço, capacetes e chapéus), em cm e graus: valores de origem, substituídos pelos do
  // ficheiro bonecos-ajustes.json ao lado desta página, se existir (é feito no editor dos bonecos, editor-bonecos.html)
  const CICAJ_PAD = { ancX: 0, ancY: 0, trX: 0, trY: 0, costas: 1, joelho: 0, maoX: 0, maoY: 0, cotov: 1, pesc: 56, cab: -10, capS: 1, capX: 0, capY: 0, chS: 1, chY: 0 };
  const CICAJ = Object.assign({}, CICAJ_PAD);
  function cicAjPoe(o){ if(o && typeof o === 'object') Object.keys(CICAJ_PAD).forEach(k=>{ if(o[k] != null && isFinite(+o[k])) CICAJ[k] = +o[k]; }); }
  let HUM = null; const HUMf = ()=> (()=>{
    const ST = { estado: 'nada', base: {}, lim: {}, fila: [] };   // nada | a carregar | pronto | falhou
    const CDN = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/';
    function script(u){ return new Promise((ok, ko)=>{ const s = document.createElement('script'); s.src = u; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }); }
    async function carrega(){
      if(ST.estado !== 'nada' || !window.THREE) return; ST.estado = 'a carregar';
      try{
        try{ const r = await fetch('bonecos-ajustes.json', { cache: 'no-cache' }); if(r.ok) cicAjPoe(await r.json()); }catch(e){}   // afinações feitas no editor (opcional)
        if(!THREE.GLTFLoader) await script(CDN + 'loaders/GLTFLoader.js');
        if(!THREE.SkeletonUtils) await script(CDN + 'utils/SkeletonUtils.js');
        const L = new THREE.GLTFLoader();
        for(const g of ['m', 'f']){
          const gl = await new Promise((ok, ko)=> L.load('ciclista_' + g + '.glb', ok, undefined, ko));
          let lim = { cintura: .45, gola: .8 }; gl.scene.traverse(o=>{ if(o.userData && o.userData.kit_cintura != null) lim = { cintura: o.userData.kit_cintura, gola: o.userData.kit_gola }; });
          ST.base[g] = gl.scene; ST.lim[g] = lim;
        }
        ST.estado = 'pronto';
      }catch(e){ console.warn('Humano realista indisponível', e); ST.estado = 'falhou'; }
    }
    // equipamento pintado ponto a ponto (o modelo guarda em cada vértice a posição ao longo do braço, coxa e perna)
    function kitMat(nome, C, O, lim){
      const rough = { pele: .55, cabelo: .85, olho: .2, pupila: .15, iris: .3, sapato: .35, sobrancelha: .9 }[nome] || .5;
      if(!['tronco', 'braco', 'perna'].includes(nome)) return new THREE.MeshStandardMaterial({ color: C[nome] || C.pele, roughness: rough, skinning: true });
      const m = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: .5, skinning: true });
      const U = {}; ['pele', 'camisola', 'manga', 'punho', 'gola', 'calcoes', 'bainha', 'meia'].forEach(k=> U['c_' + k] = { value: new THREE.Color(C[k] || C.camisola || '#fff') });
      U.lim = { value: new THREE.Vector4(O.manga == null ? .45 : O.manga, O.calca == null ? .66 : O.calca, lim.cintura, lim.gola) }; U.nu = { value: O.nu ? (O.top ? 2 : 1) : 0 };
      m.onBeforeCompile = sh=>{
        Object.assign(sh.uniforms, U);
        sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute vec4 color;\nvarying vec4 vKit;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvKit = color;');
        const dec = Object.keys(U).map(k=> 'uniform ' + (k === 'lim' ? 'vec4' : k === 'nu' ? 'float' : 'vec3') + ' ' + k + ';').join('\n');
        const T = nome === 'tronco' ? 'float hz = vKit.a; vec3 cc = hz < lim.z ? c_calcoes : (hz > lim.w ? c_pele : (hz > lim.w - .022 && nu < .5 ? c_gola : (nu > 1.5 ? (hz > .655 && hz < .79 ? c_camisola : c_pele) : nu > .5 ? c_pele : c_camisola)));'
          : nome === 'braco' ? 'float tu = vKit.r * 2. - .5; vec3 cc = nu > .5 ? c_pele : tu < lim.x ? c_manga : (tu < lim.x + .07 ? c_punho : c_pele);'
          : 'float tt = vKit.g * 2. - .5, tc = vKit.b * 2. - .5; vec3 cc = tt < lim.y ? c_calcoes : (tt < lim.y + .05 ? c_bainha : (tc > .87 && lim.y < 2. ? c_meia : c_pele));';
        sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec4 vKit;\n' + dec).replace('vec4 diffuseColor = vec4( diffuse, opacity );', T + '\nvec4 diffuseColor = vec4( cc, opacity );');
      };
      m.customProgramCacheKey = ()=> 'kit' + nome;
      return m;
    }
    function cria(av, C, O){
      if(ST.estado !== 'pronto') return null;
      const g = av.g === 'f' ? 'f' : 'm', o = THREE.SkeletonUtils.clone(ST.base[g]), ossos = {};
      o.traverse(m=>{ if(m.isBone) ossos[m.name] = m; if(m.isMesh){ m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false; m.material = kitMat(m.material.name, C, O, ST.lim[g]); } });
      const rest = {}; Object.entries(ossos).forEach(([n, b])=> rest[n] = b.quaternion.clone());
      o.updateMatrixWorld(true);
      const W = n=> ossos[n].getWorldPosition(new THREE.Vector3());
      const comp = (a, b)=> W(a).distanceTo(W(b));
      const pelvis0 = W('pelvis'), info = { coxa: comp('thigh_l', 'calf_l'), perna: comp('calf_l', 'foot_l'), braco: comp('upperarm_l', 'lowerarm_l'), ante: comp('lowerarm_l', 'hand_l'), tornozelo: W('foot_l').y };
      const q0cab = ossos.head.getWorldQuaternion(new THREE.Quaternion());
      return { o, ossos, rest, pelvis0, info, q0cab, g };
    }
    // roda o osso para que o ponto "filho" fique na direção do alvo (tudo em coordenadas do mundo)
    const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _q = new THREE.Quaternion(), _qb = new THREE.Quaternion(), _qp = new THREE.Quaternion();
    function aponta(b, filho, alvo){
      b.updateMatrixWorld(true); const p = b.getWorldPosition(_a), c = filho.getWorldPosition(_b).sub(p).normalize(), d = alvo.clone().sub(p).normalize();
      _q.setFromUnitVectors(c, d); b.getWorldQuaternion(_qb); b.parent.getWorldQuaternion(_qp);
      b.quaternion.copy(_qp.invert().multiply(_q.multiply(_qb))); b.updateMatrixWorld(true);
    }
    function ik(A, T, a, b, pole){
      const d = T.clone().sub(A); let l = d.length(); const u = d.clone().normalize(); l = Math.min(l, a + b - 1e-4);
      const ca = Math.max(-1, Math.min(1, (a * a + l * l - b * b) / (2 * a * l))), sa = Math.sqrt(1 - ca * ca);
      const v = pole.clone().sub(u.clone().multiplyScalar(pole.dot(u))).normalize();
      return A.clone().add(u.multiplyScalar(a * ca)).add(v.multiplyScalar(a * sa));
    }
    // põe o corpo na postura: H anca, Sh ombros, pes[2] pedais, maos[2] guiador (coordenadas do grupo G)
    function pose(h, G, H, Sh, pes, maos, cot, poleP, sent){
      const { o, ossos: B, rest } = h, W = v=> G.localToWorld(v.clone()), dirW = v=> v.clone().transformDirection(G.matrixWorld);
      Object.entries(rest).forEach(([n, q])=> B[n].quaternion.copy(q));
      o.position.set(H.x - h.pelvis0.x, H.y - h.pelvis0.y + .02, H.z - h.pelvis0.z); o.updateMatrixWorld(true);
      // tronco: inclina para os ombros; cabeça a olhar em frente
      aponta(B.spine_01, B.neck_01, W(Sh));
      if(!sent){ const ax = dirW(new THREE.Vector3(0, 0, 1)); [['spine_01', .1], ['spine_02', -.06], ['spine_03', -.1]].forEach(([n, a])=>{ const o = B[n]; _q.setFromAxisAngle(ax, a * CICAJ.costas); o.getWorldQuaternion(_qb); o.parent.getWorldQuaternion(_qp); o.quaternion.copy(_qp.invert().multiply(_q.multiply(_qb))); o.updateMatrixWorld(true); }); }   // costas ligeiramente arredondadas
      aponta(B.neck_01, B.head, B.neck_01.getWorldPosition(new THREE.Vector3()).add(dirW(new THREE.Vector3(sent ? .45 : Math.tan(Math.min(85, Math.max(0, CICAJ.pesc)) * Math.PI / 180), 1, 0))));   // pescoço no prolongamento das costas (mais deitado na bicicleta)
      { const qh = G.getWorldQuaternion(new THREE.Quaternion()).multiply(_q.setFromAxisAngle(new THREE.Vector3(0, 0, 1), sent ? -.05 : CICAJ.cab * Math.PI / 180)).multiply(h.q0cab); B.head.parent.getWorldQuaternion(_qp); B.head.quaternion.copy(_qp.invert().multiply(qh)); B.head.updateMatrixWorld(true); }   // cabeça levantada a olhar a estrada, queixo ligeiramente para baixo
      // pernas: anca → joelho → tornozelo no pedal
      [['l', 0], ['r', 1]].forEach(([s, i])=>{
        const A = B['thigh_' + s].getWorldPosition(new THREE.Vector3()), T = W(pes[i].clone().add(new THREE.Vector3(sent ? -.05 : -.07, h.info.tornozelo * .9, 0)));
        const k = ik(A, T, h.info.coxa * G.scale.x, h.info.perna * G.scale.x, dirW(new THREE.Vector3(poleP.x, poleP.y, (s === 'l' ? -1 : 1) * CICAJ.joelho)));
        aponta(B['thigh_' + s], B['calf_' + s], k); aponta(B['calf_' + s], B['foot_' + s], T);
        aponta(B['foot_' + s], B['ball_' + s], T.clone().add(dirW(new THREE.Vector3(1, sent ? .35 : -.05, 0))));
        // braços: ombro → cotovelo → mão no guiador
        const S0 = B['upperarm_' + s].getWorldPosition(new THREE.Vector3()), M = W(maos[i].clone().add(new THREE.Vector3(-.075, .015, 0))), sz = s === 'l' ? -1 : 1;   // pulso um pouco atrás da manete (a mão agarra-a)
        const e = ik(S0, M, h.info.braco * G.scale.x, h.info.ante * G.scale.x, dirW(new THREE.Vector3(cot.x, cot.y, sz * cot.z)));
        aponta(B['upperarm_' + s], B['lowerarm_' + s], e); aponta(B['lowerarm_' + s], B['hand_' + s], M);
        aponta(B['hand_' + s], B['middle_01_' + s], M.clone().add(dirW(new THREE.Vector3(1, -.45, sz * .1))));
        // dedos fechados à volta da manete
        const dm = B['middle_01_' + s].getWorldPosition(new THREE.Vector3()).sub(M).normalize(), ax = dm.clone().cross(dirW(new THREE.Vector3(0, 1, 0))).normalize();
        ['index', 'middle', 'ring', 'pinky', 'thumb'].forEach(n=>{ for(let k = 1; k <= 3; k++){ const o = B[n + '_0' + k + '_' + s]; if(!o) continue;
          const ang = n === 'thumb' ? (k === 1 ? 0 : -.35) : (k === 1 ? -.75 : -.9); _q.setFromAxisAngle(ax, ang);
          o.getWorldQuaternion(_qb); o.parent.getWorldQuaternion(_qp); o.quaternion.copy(_qp.invert().multiply(_q.multiply(_qb))); o.updateMatrixWorld(true); } });
      });
    }
    // centro da cabeça e rotação (para o capacete ou chapéu acompanhar a cabeça)
    function cabeca(h, G){
      const b = h.ossos.head; b.updateMatrixWorld(true);
      const p = G.worldToLocal(b.localToWorld(new THREE.Vector3(0, .058, .016)));
      const q = G.getWorldQuaternion(new THREE.Quaternion()).invert().multiply(b.getWorldQuaternion(new THREE.Quaternion())).multiply(h.q0cab.clone().invert());
      return { p, q };
    }
    return { carrega, cria, pose, cabeca, get estado(){ return ST.estado; } };
  })();

  const CIC3 = (()=>{
    const V = (x, y, z)=> new THREE.Vector3(x, y, z || 0), UP = V(0, 1, 0);
    if(!HUM){ HUM = HUMf(); HUM.carrega(); }
    const MAT = {};
    function mat(cor, o){ const k = cor + JSON.stringify(o || {}); return MAT[k] || (MAT[k] = new THREE.MeshStandardMaterial(Object.assign({ color: new THREE.Color(cor), roughness: .62, metalness: 0 }, o || {}))); }
    function junta(gs){   // várias geometrias numa só (menos chamadas ao desenhar)
      let n = 0; gs = gs.map(g=> g.index ? g.toNonIndexed() : g); gs.forEach(g=> n += g.attributes.position.count);
      const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3); let o = 0;
      gs.forEach(g=>{ pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); o += g.attributes.position.count; });
      const r = new THREE.BufferGeometry(); r.setAttribute('position', new THREE.BufferAttribute(pos, 3)); r.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); return r;
    }
    function tubo(A, B, rA, rB, seg){
      const d = B.clone().sub(A), L = d.length(), g = new THREE.CylinderGeometry(rB == null ? rA : rB, rA, L, seg || 10, 1);
      g.applyMatrix4(new THREE.Matrix4().compose(A.clone().add(B).multiplyScalar(.5), new THREE.Quaternion().setFromUnitVectors(UP, d.normalize()), V(1, 1, 1))); return g;
    }
    function bola(c, r, sx, sy, sz, seg){ const g = new THREE.SphereGeometry(r, seg || 14, Math.round((seg || 14) * .7)); g.applyMatrix4(new THREE.Matrix4().compose(c, new THREE.Quaternion(), V(sx || 1, sy || 1, sz || 1))); return g; }
    function malha(g, m, sombra){ const me = new THREE.Mesh(g, m); me.castShadow = sombra !== false; return me; }
    function tex(w, h, fn){ const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t; }
    // ---------- as bicicletas ----------
    const BB = V(-.07, .27);
    function roda(R, pneu, disco){
      const g = new THREE.Group();
      g.add(malha(new THREE.TorusGeometry(R - pneu, pneu, 8, 40), mat('#1a1a1c', { roughness: .9 })));
      const aro = malha(new THREE.TorusGeometry(R - pneu * 2 - .02, .02, 6, 40), mat('#2b2e33', { metalness: .6, roughness: .35 })); aro.scale.z = .5; g.add(aro);
      if(disco){ g.add(malha(new THREE.CylinderGeometry(R - pneu * 2 - .01, R - pneu * 2 - .01, .03, 36).rotateX(Math.PI / 2), mat('#1d2026', { metalness: .4, roughness: .35 }))); return g; }
      const rs = []; for(let k = 0; k < 20; k++){ const a = k / 20 * Math.PI * 2, z = (k % 2 ? 1 : -1) * .025; rs.push(tubo(V(0, 0, z), V(Math.cos(a) * (R - pneu * 2 - .02), Math.sin(a) * (R - pneu * 2 - .02), 0), .0018, .0018, 3)); }
      rs.push(new THREE.CylinderGeometry(.018, .018, .1, 10).rotateX(Math.PI / 2));
      g.add(malha(junta(rs), mat('#c9ced6', { metalness: .8, roughness: .3 }), false));
      return g;
    }
